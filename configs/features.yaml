named_road_classes: [motorway, trunk, primary, secondary]
drivable_road_classes:
  [motorway, trunk, primary, secondary, tertiary, residential, unclassified]
boundary_distances_m: [10, 25, 50]
osm_large_footprint_m2: [500, 1500, 5000]
ml_dominated_share: 0.95
min_ml_for_tract_median: 5
building_datasets:
  osm: OpenStreetMap
  microsoft: Microsoft%
  google: Google%
  esri: Esri%
ml_datasets: [microsoft, google]
place_datasets:
  meta: meta
  microsoft: Microsoft%
  foursquare: Foursquare%
# Route network groups on Overture `routes[].network` (OSM route relations). A segment belongs to
# every group any of its routes matches. Patterns are DuckDB regexes matched on the full value.
route_groups:
  interstate: 'US:I'
  us_route: 'US:US'
  state: 'US:(AZ|CA|OK|TX|WA|NM)'
  state_secondary: 'US:TX:(FM|RM|Loop|Spur|Business|PR|Park|Beltway)|US:WA:secondary|US:AZ:Loop'
  toll: 'US:OK:Turnpike|US:TX:Toll|US:TX:NTTA|US:TX:Harris:HCTRA|US:TX:[A-Za-z_]*:?Toll.*|Texas Trunk System'
  business: 'US:(I|US):(Business|Alternate|Truck|Bypass|Spur|Business:Loop|Business:Spur)'
  county: 'US:(OK|TX|CA|WA|AZ|NM):(CR|[A-Z][a-z]+(_[A-Z][a-z]+)*)'
# Candidate TIGER S1100 + S1200 proxies, as unions of route groups.
reference_sets:
  A: [interstate, us_route, state]
  B: [interstate, us_route, state, state_secondary, toll, business]
  C: [interstate, us_route, state, state_secondary, toll, business, county]
# Context columns from <region>-strata-tract-table. The building-count strata at the end
# (usfs_Building*, carbonplan_buildings) feed hypothesis H-B3 only (decisions D017).
strata_columns:
  [COUNTYFP, ALAND, pop_total, pop_urban, pct_urban, ur_class, svi_overall, svi_socioeconomic,
   svi_household, svi_minority, svi_housing_transport, cvi_overall, ruca_primary, ruca_secondary,
   ruca_pop_density, rucc_2023, rucc_metro, nchs_2013, tribal_any, tribal_pct, tribal_legal,
   tribal_statistical, usdm_summer_dsci, usdm_winter_dsci, usfs_WHP_mean, usfs_RPS_mean,
   usfs_HUCount_sum, usfs_PopCount_sum, epht_heat_days_summer, mtbs_wildfire_burned_pct_land,
   nifc_wildfire_burned_pct_land, nifc_years_since_wildfire, ghcn_any_nearest_km,
   usfs_BuildingCount_sum, usfs_BuildingCover_mean, usfs_BuildingDensity_mean,
   carbonplan_buildings]
