bucket: s3://us-west-2.opendata.source.coop/humane-intelligence/bias-bounty-mapping-equity-challenge
proxy: https://data.source.coop/humane-intelligence/bias-bounty-mapping-equity-challenge
s3_endpoint: https://s3.us-west-2.amazonaws.com
overture_release: 2026-08-19.0

regions:
  - maricopa-az
  - northern-ca
  - eastern-ok
  - south-central-tx
  - eastern-wa

scored_tracts:
  maricopa-az: 1593
  northern-ca: 591
  eastern-ok: 1192
  south-central-tx: 6003
  eastern-wa: 415

overture_layers:
  - buildings
  - roads
  - roads-unfiltered
  - rail
  - infrastructure
  - pois

strata_tables:
  - strata-tract-table
  - census-tract-table
  - census-tracts
  - svi-tract-table
  - cvi-tract-table
  - ruca-tract-table
  - rucc-tract-table
  - nchs-tract-table
  - tribal-tract-table
  - usdm-drought-tract-table
  - drought-gov-tract-table
  - epht-heat-tract-table
  - nasa-heat-tract-table
  - cdc-wonder-tract-table
  - cdc-wonder-heat-mortality
  - noaa-ghcn-tract-table
  - noaa-ghcn-stations
  - usfs-wildfire-tract-table
  - carbonplan-tract-table
  - mtbs-tract-table
  - nifc-tract-table
  - fpa-fod-tract-table
  - usgs-combined-tract-table
  - census-aiannh
  - census-tribal-tracts
  - census-tribal-subdivisions

# File-name regexes; {region}, {layer} and {table} expand to alternations of the lists above.
allowlist:
  - '^README\.md$'
  - '^SampleSubmission\.csv$'
  - '^{region}-overture-{layer}\.parquet$'
  - '^{region}-census-acs-housing\.(parquet|csv)$'
  - '^{region}-sample-submission\.csv$'
  - '^({region}|national)-{table}\.(parquet|csv)$'
  - '^all-aois\.geojson$'
  - '^original-rings\.geojson$'
  - '^{region}-aoi\.geojson$'
  - '^{region}-tract-geoids\.csv$'

denylist:
  - coverage-gap
  - coverage_gap
  - tiger
  - mtfcc
  - microsoft
  - msft
  - footprint
  - hifld
  - usgs
  - structures
  - cbp
  - zbp
  - business-patterns

sync:
  workers: 8
  attempts: 3

# Public reference sources permitted by Zindi staff on 27 Oct 2026. Only these file names are
# admitted; organiser coverage-gap files stay forbidden regardless.
external_reference:
  enabled: true
  tiger_prisecroads_url: https://www2.census.gov/geo/tiger/TIGER2025/PRISECROADS/tl_2025_{state}_prisecroads.zip
  states: ['04', '06', '35', '40', '48', '53']
  building_url: https://minedbuildings.z5.web.core.windows.net/legacy/usbuildings-v2/{state}.geojson.zip
  building_states: [Arizona, NewMexico, California, Oklahoma, Texas, Washington]
  facility_url: https://prd-tnm.s3.amazonaws.com/StagedProducts/Struct/GPKG/STRUCT_{state}_State_GPKG.zip
  facility_states: [Arizona, New_Mexico, California, Oklahoma, Texas, Washington]
  facility_fcodes:
    fire: [74026]
    ems: [74034]
    schools: [73002, 73003, 73004, 73005]
    college: [73006]
  allowlist:
    - '^tl_2025_\d{2}_prisecroads\.zip$'
    - '^STRUCT_[A-Za-z_]+_State_GPKG\.zip$'
    - '^facility_reference_tracts\.parquet$'
    - '^(Arizona|NewMexico|California|Oklahoma|Texas|Washington)\.geojson\.zip$'
    - '^building_reference_tracts\.parquet$'
    - '^tiger_tracts\.parquet$'
always_denied: [coverage-gap, coverage_gap]
