seed: 20261025
mc_draws: 2000
chunk_rows: 2000
alpha: 1.0

# Share of tracts with at least one undefined component (organisers, Zindi page). B and P are
# rarely undefined, so these are close to P(transport undefined). eastern-wa has no published rate.
published_undefined_rate:
  eastern-ok: 0.21
  northern-ca: 0.37
  south-central-tx: 0.28
  maricopa-az: 0.55
undefined_other_components: 0.01

transport:
  # proxy: route-network estimate; tiger: exact gap against TIGER S1100 + S1200 (stage 05).
  source: proxy
  # A = interstate, US and state routes; B adds secondary state, toll and business routes.
  # Tracts on A (or with motorway or trunk) are the high tier, tracts on B only the mid tier.
  reference_set: A
  secondary_set: B
  boundary_d_m: 25
  exclude_links: false
  unclipped: false
  p_defined_high: 0.98
  p_defined_floor: 0.02
  sigma: 0.15
  # Multiplies every transport gap draw, clipped to [0, 1] (tuned scalar, decisions log).
  value_scale: 1.0
  fallback_sigma: 1.0

building:
  # proxy: baseline estimate; microsoft: exact gap against Microsoft US footprints (stage 05).
  source: proxy
  count: centroid
  baseline_gap: 0.01
  # The per-unit floor flags metro apartment tracts, where few footprints per unit is real.
  use_hu_deficit: false
  # H-B3: reference count from USFS Wildfire Risk building counts, scaled per region by the
  # median Overture/USFS ratio in ML-dominated tracts. `none` keeps the baseline gap.
  reference: none
  usfs_column: usfs_BuildingCount_sum
  ml_dominated_share: 0.95
  hu_ratio_quantile: 0.02
  min_ml_tracts: 20
  p_defined_with_evidence: 0.995
  p_defined_without: 0.2

poi:
  mode: constant
  # Multiplies the regional POI constant (tuned scalar, decisions log).
  level: 1.0
  # Uncaptured reference fire stations per Overture fire place (poi.mode: fire).
  fire_uncaptured: 0.5
  # Share of the fire model blended into the regional constant (tuned scalar 5).
  fire_strength: 1.0
  kappa_E: 0.0
  sigma_E: 0.5
  kappa_F: 1.0
  facility_weight: 0.5
  # kappa: expected reference facilities per Overture place of the type. Overture carries two
  # to three school places per school (duplicates, campuses, district offices); fire and EMS are
  # close to one to one (organisers' README for EMS).
  facility_types:
    fire: {group: fire, driver: pop_area, kappa: 1.0}
    ems: {group: ems, driver: pop_area, kappa: 1.0}
    schools: {group: school, driver: pop, kappa: 0.4}
