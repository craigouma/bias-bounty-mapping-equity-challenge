username: carloscrou
code_dataset: bbme-code
accelerator: NvidiaTeslaT4

stages:
  00_env:
    slug: bbme-00-env
    gpu: true
    kernel_sources: []
    pull: ['env/.*']
  01_ingest:
    slug: bbme-01-ingest
    gpu: false
    kernel_sources: []
    pull: ['audit/.*']
  02_features:
    slug: bbme-02-features
    gpu: false
    kernel_sources: [bbme-01-ingest]
    pull: ['features/.*']
  03_model:
    slug: bbme-03-model
    gpu: false
    kernel_sources: [bbme-02-features, bbme-05-reference, bbme-06-facilities, bbme-07-establishments]
    pull: ['runs/{run_id}/.*']
  04_analysis:
    slug: bbme-04-analysis
    gpu: false
    kernel_sources: [bbme-01-ingest, bbme-02-features, bbme-03-model]
    pull: ['analysis/.*']
  05_reference:
    slug: bbme-05-reference
    gpu: false
    kernel_sources: [bbme-01-ingest]
    pull: ['reference/.*']
  06_facilities:
    slug: bbme-06-facilities
    gpu: false
    kernel_sources: [bbme-01-ingest]
    pull: ['facilities/.*']
  07_establishments:
    slug: bbme-07-establishments
    gpu: false
    kernel_sources: [bbme-02-features]
    pull: ['establishments/.*']
