[project]
name = "bbme"
version = "0.1.0"
description = "Coverage gap estimation for the Bias Bounty Mapping Equity Challenge"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "duckdb==1.5.4",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pyproj>=3.6,<3.8",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bbme"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PD"]
ignore = ["PD011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["tests"]
